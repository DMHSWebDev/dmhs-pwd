<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — DMHS PWD</title>
    <!-- Not useful in search results, so ask search engines to skip it -->
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/theme.js"></script>
</head>

<body>
    <canvas id="grid" aria-hidden="true"></canvas>
    <div class="scanline" aria-hidden="true"></div>
    <header class="site-nav" id="site-nav"></header>

    <div class="page">
        <main class="wrap">
            <header class="brand">
                <span class="prompt">dmhs@pwd</span><span class="colon">:</span><span class="path">~/???</span><span class="dollar">$</span>
            </header>

            <p class="big-code">404</p>
            <h1 class="title">Page not found</h1>

            <div class="status">
                <span class="dot" aria-hidden="true"></span>
                <span>that page doesn&rsquo;t exist</span><span class="cursor" aria-hidden="true">&#9608;</span>
            </div>

            <nav class="links" aria-label="Where to go">
                <a class="link-card" href="/">
                    <span class="link-title">Home</span>
                    <span class="link-tag">cd ~</span>
                </a>
                <a class="link-card" href="/projects">
                    <span class="link-title">Projects</span>
                    <span class="link-tag">cd ~/projects</span>
                </a>
            </nav>
        </main>
    </div>

    <script src="/js/nav.js"></script>
    <script src="/js/grid.js"></script>
</body>

</html>
