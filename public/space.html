<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Space Picture of the Day | DMHS Programming &amp; Web Development</title>
    <meta name="description" content="See NASA&#39;s space picture for any day since 1995. A project from Doherty Memorial High School&#39;s Programming &amp; Web Development CTE program.">
    <link rel="canonical" href="https://dmhspwd.org/space">
    <meta name="theme-color" content="#0b0809">

    <!-- Link previews (Google Classroom, Teams, texts, social media) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DMHS Programming &amp; Web Development">
    <meta property="og:title" content="NASA Space Picture of the Day | DMHS Programming &amp; Web Development">
    <meta property="og:description" content="See NASA&#39;s space picture for any day since 1995. A project from Doherty Memorial High School&#39;s Programming &amp; Web Development CTE program.">
    <meta property="og:url" content="https://dmhspwd.org/space">
    <meta property="og:image" content="https://dmhspwd.org/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Doherty Memorial High School Programming &amp; Web Development, a Career &amp; Technical Education program in Worcester, MA">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/theme.js"></script>
</head>

<body>
    <canvas id="grid" aria-hidden="true"></canvas>
    <div class="scanline" aria-hidden="true"></div>
    <header class="site-nav" id="site-nav"></header>

    <div class="page">
        <main class="wrap wide">
            <header class="brand">
                <span class="prompt">dmhs@pwd</span><span class="colon">:</span><span class="path">~/space</span><span class="dollar">$</span>
            </header>

            <div class="page-head">
                <p class="kicker">Projects &middot; NASA API</p>
                <h1 class="title">Space Picture of the Day</h1>
                <p class="lede">Every day since June 16, 1995, NASA has posted a new picture of space. Pick any date to see that day&rsquo;s picture.</p>
            </div>

            <form class="space-form" id="space-form">
                <label class="field">Pick a date
                    <input class="input" type="date" id="date" min="1995-06-16">
                </label>
                <button class="btn" type="submit">Show picture</button>
                <button class="btn btn-ghost" id="today-button" type="button">Today</button>
            </form>

            <p class="notice" id="status" role="status"></p>
            <div class="apod-skeleton" id="skeleton" aria-hidden="true"></div>

            <article id="result" hidden>
                <figure class="apod-frame">
                    <img id="picture" alt="">
                </figure>
                <span class="chip" id="date-shown"></span>
                <h2 class="apod-title" id="title"></h2>
                <p class="apod-desc" id="description"></p>
                <a class="text-link" id="nasa-link" target="_blank" rel="noopener">Read the full story on NASA&rsquo;s website &rarr;</a>
            </article>
        </main>
    </div>

    <script src="/js/nav.js"></script>
    <script src="/js/grid.js"></script>
    <script src="/js/space.js"></script>
</body>

</html>
