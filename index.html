<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doherty Memorial High School — PWD</title>
  <meta name="description" content="Doherty Memorial High School — Programming & Web Development" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌘</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="grid"></canvas>

  <div class="scanline" aria-hidden="true"></div>

  <main class="wrap">
    <header class="brand">
      <span class="prompt">dmhs@pwd</span><span class="colon">:</span><span class="path">~</span><span class="dollar">$</span>
    </header>

    <section class="hero">
      <p class="kicker">Doherty Memorial High School</p>
      <h1 class="title">Programming &amp; Web Development</h1>

      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="typed"></span><span class="cursor" aria-hidden="true">&#9608;</span>
      </div>

      <div class="progress" role="progressbar" aria-label="Site under construction" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar"></div>
      </div>

      <div class="periods">
        <span class="chip">Periods 2/3</span>
        <span class="chip">Periods 6/7</span>
      </div>
    </section>

    <nav class="links" aria-label="Coming soon">
      <div class="link-card disabled">
        <span class="link-title">Student Sites</span>
        <span class="link-tag">coming soon</span>
      </div>
      <div class="link-card disabled">
        <span class="link-title">Classroom Chat</span>
        <span class="link-tag">coming soon</span>
      </div>
      <div class="link-card disabled">
        <span class="link-title">Student Games</span>
        <span class="link-tag">coming soon</span>
      </div>
    </nav>

    <footer class="footer">
      <span>&#47;&#47; more soon</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
